name: Security Scan (Strix)

# 手動実行のみ（2026-11-16に月1回の定期実行を入れたが、同日に取り消した）。定期実行にする時は、下のコメントを外す。
# 1回あたり約14ドル（上限15ドル）かかる。
# 結果（strix_runs/）には脆弱性の詳細が入るため、公開リポジトリではArtifactに保存しない。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 18 1 * *'   # 毎月2日 03:00 JST（UTCの毎月1日18:00）

jobs:
  strix:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash
      - name: Run scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: strix -n -t ./ --scan-mode deep --max-budget 30 --fail-on high --instruction-file .github/strix-instruction.md
